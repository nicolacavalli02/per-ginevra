<!doctype html>
<!-- L'icona dell'app (schermata Home): il sigillo di ceralacca della busta su fondo scuro.
     Si fotografa con strumenti/fai-icona.js. Il sigillo sta dentro il cerchio centrale
     dell'80%, la zona che Android non taglia mai (icona "maskable"). -->
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Bodoni Moda";
    src: url("../assets/fonts/bodoni-moda.woff2") format("woff2");
    font-weight: 400 700;
  }
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 42%, #2a2018 0%, #14110f 70%);
  }
  .sigillo {
    position: relative;
    display: grid;
    place-items: center;
    width: 300px;
    height: 300px;
    border-radius: 47% 53% 51% 49% / 52% 48% 52% 48%;
    background: radial-gradient(circle at 36% 30%, #d5514a, #a8201f 45%, #6f1213 100%);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
  }
  .sigillo::before {
    content: "";
    position: absolute;
    inset: 36px;
    border: 7px solid rgba(60, 5, 5, 0.3);
    border-radius: 50%;
    box-shadow: 0 3px 0 rgba(255, 255, 255, 0.16);
  }
  .sigillo span {
    font: 700 150px / 1 "Bodoni Moda", serif;
    color: #6f1213;
    text-shadow: 0 4px 0 rgba(255, 255, 255, 0.2);
    transform: translateY(-4px);
  }
</style>
</head>
<body>
  <div class="sigillo"><span>G</span></div>
</body>
</html>
